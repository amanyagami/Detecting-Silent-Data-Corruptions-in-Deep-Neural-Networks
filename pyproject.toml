[project]
name = "drdna"
version = "0.2.0"
description = "Unofficial reproduction of Dr. DNA (ASPLOS '24) silent-data-corruption detection, with a vectorized implementation and a leakage-free evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2", "torchvision>=0.17"]

[project.scripts]
drdna-eval = "drdna.evaluate:main"

[project.optional-dependencies]
legacy = ["pytorchfi==0.6.0", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drdna"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D107", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

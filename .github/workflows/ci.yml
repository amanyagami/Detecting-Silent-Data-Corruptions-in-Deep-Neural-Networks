name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra plots
      - run: uv run ruff format --check src/drdna tests/test_drdna.py scripts
      - run: uv run ruff check src/drdna tests/test_drdna.py scripts
      - run: uv run pytest tests/test_drdna.py -q
